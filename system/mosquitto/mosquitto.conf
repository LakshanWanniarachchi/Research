# Mosquitto configuration for the ECG screening prototype
# =======================================================
#
# Mosquitto is the broker. This project does not implement one: writing an MQTT
# broker would be re-implementing a mature, security-sensitive piece of
# infrastructure for no research benefit. Mosquitto is the reference
# implementation, is packaged everywhere, and is what a deployment would use.
#
# Start it with:
#     mosquitto -c mosquitto.conf -v
#
# Or with Docker, from this directory:
#     docker run -it -p 1883:1883 \
#       -v "$PWD/mosquitto.conf:/mosquitto/config/mosquitto.conf" \
#       -v "$PWD/passwd:/mosquitto/config/passwd" \
#       eclipse-mosquitto:2

# ---------------------------------------------------------------------------
# Listener
# ---------------------------------------------------------------------------
listener 1883 0.0.0.0

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Anonymous access is OFF. Mosquitto 2.x defaults to refusing anonymous
# connections and that default is kept deliberately: an open broker on a
# reachable port is an open relay, and anything on the network could publish
# fabricated ECG readings into a patient's record.
#
# Create the password file before first start:
#     mosquitto_passwd -c passwd ecg-server
#     mosquitto_passwd    passwd esp32-001
allow_anonymous false
password_file /mosquitto/config/passwd

# ---------------------------------------------------------------------------
# Access control
# ---------------------------------------------------------------------------
# Without an ACL every authenticated client can publish to every topic, so one
# compromised device could file readings against any patient. Restricting each
# device to its own topic subtree is what makes the device_id in a topic
# trustworthy.
#
# acl_file /mosquitto/config/acl
#
# Example acl file contents:
#     user ecg-server
#     topic read  ecg/+/reading
#     topic write ecg/+/result
#     topic read  ecg/+/status
#
#     user esp32-001
#     topic write ecg/esp32-001/reading
#     topic read  ecg/esp32-001/result
#     topic write ecg/esp32-001/status

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
# Retained status messages survive a broker restart, so a dashboard that
# connects later still learns which devices are online.
persistence true
persistence_location /mosquitto/data/

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---------------------------------------------------------------------------
# TLS  -  required for any deployment beyond a trusted LAN
# ---------------------------------------------------------------------------
# Port 1883 is plaintext. Physiological data and the device token both travel
# in clear, readable by anything on the path. A real deployment listens on 8883
# instead:
#
# listener 8883 0.0.0.0
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# require_certificate false
#
# This is stated in the thesis as a limitation of the prototype rather than
# left implicit.
