# Mosquitto configuration for the ECG screening prototype - Windows / native
# ==========================================================================
#
# The sibling file mosquitto.conf is written for the Docker image and uses
# container-absolute paths (/mosquitto/config/...). That file cannot start a
# native Windows broker, which is what this project actually runs. This one
# uses paths relative to itself, so it works when started from this folder:
#
#     cd system\mosquitto
#     "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.windows.conf -v
#
# The installer also registers a Windows service that listens on 127.0.0.1
# only. That service must be stopped before this configuration can bind
# 0.0.0.0:1883, or the port is already taken.

# ---------------------------------------------------------------------------
# Listener
# ---------------------------------------------------------------------------
# 0.0.0.0 rather than localhost: the ESP32 is a separate machine on the same
# Wi-Fi network, so the broker has to accept connections from the network
# interface, not just from this laptop.
listener 1883 0.0.0.0

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Anonymous access stays off. An open broker on a reachable port is an open
# relay: anything on the network could publish fabricated ECG readings into a
# patient's record, or read someone's ECG off the wire.
#
# The password file is NOT in version control. Create it with:
#     "C:\Program Files\mosquitto\mosquitto_passwd.exe" -c passwd ecg-server
#     "C:\Program Files\mosquitto\mosquitto_passwd.exe"    passwd esp32-001
allow_anonymous false
password_file passwd

# ---------------------------------------------------------------------------
# Access control
# ---------------------------------------------------------------------------
# Without an ACL every authenticated client may publish to every topic, so one
# compromised device could file readings against another user. Restricting each
# device to its own subtree is what makes the device id inside a topic worth
# trusting. The server account gets the wildcards; each device gets only its
# own branch.
acl_file acl

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
# Retained status messages survive a broker restart, so the dashboard still
# learns which devices are online after the broker is restarted.
persistence true
persistence_location data/
persistence_file mosquitto.db

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest stdout
log_dest file log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---------------------------------------------------------------------------
# TLS - required for any deployment beyond a trusted local network
# ---------------------------------------------------------------------------
# Port 1883 is plaintext: the ECG samples and the device credentials travel in
# clear and are readable by anything on the path. That is acceptable for a
# prototype on a private hotspot and is not acceptable for a deployment, which
# would listen on 8883 instead:
#
# listener 8883 0.0.0.0
# cafile   certs/ca.crt
# certfile certs/server.crt
# keyfile  certs/server.key
# require_certificate false
#
# The thesis states this as a limitation of the prototype rather than leaving
# it implicit.
